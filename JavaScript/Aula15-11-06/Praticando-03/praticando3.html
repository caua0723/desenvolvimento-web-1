<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Praticando 3 - Formulário com validações</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script src="praticando3.js" defer></script></head><body><div class="container py-3"><h1>Praticando 3 - Formulário com validações</h1><form id="formulario" class="row g-3" novalidate>
<div class="col-md-6"><label for="nome" class="form-label">Nome</label><input type="text" id="nome" class="form-control is-invalid"><div class="invalid-feedback">Informe seu nome completo</div></div>
<div class="col-md-6"><label for="email" class="form-label">E-mail</label><input type="email" id="email" class="form-control is-invalid" placeholder="seu@email.aqui"><div class="invalid-feedback">Informe um endereço de email válido</div></div>
<div class="col-md-6"><label for="telefone" class="form-label">Telefone</label><input type="text" id="telefone" class="form-control is-invalid"><div class="invalid-feedback">Informe um telefone de contato</div></div>
<div class="col-md-6"><label for="idade" class="form-label">Idade</label><select id="idade" class="form-select is-invalid"><option value="">[Escolha uma opção]</option><option value="ate18">Até 18 anos</option><option value="19a25">19 a 25 anos</option><option value="26a40">26 a 40 anos</option><option value="acima40">Acima de 40 anos</option></select><div class="invalid-feedback">Escolha a opção que representa sua idade atual</div></div>
<div class="col-12"><label for="observacoes" class="form-label">Observações</label><textarea id="observacoes" class="form-control is-invalid" rows="3"></textarea></div>
<div class="col-12 text-center"><button type="button" id="enviar" class="btn btn-primary">Enviar</button><button type="button" id="limpar" class="btn btn-warning">Limpar</button></div></form></div></body></html>
