<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Praticando 5 - Mini-game JS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .quadrado {
            display: inline-block;
            width: 100px;
            height: 100px;
            border: 4px solid black;
            margin-right: 8px;
            cursor: pointer;
        }

        #vermelho { background-color: red; }
        #azul { background-color: blue; }
        #verde { background-color: green; }

        .selecionado {
            position: absolute;
            border-color: gold;
        }
    </style>
    <script src="praticando5.js" defer></script>
</head>
<body>
    <div class="container py-3">
        <h1>Praticando 5 - Mini-game JS</h1>
        <h6><u>Instruções:</u></h6>
        <ol>
            <li>Clique em um dos quadrados coloridos</li>
            <li>Depois use as teclas <mark>W</mark> <mark>A</mark> <mark>S</mark> <mark>D</mark>
                para movimentar os elementos para cima, esquerda, baixo e direita respectivamente.</li>
        </ol>
        <div class="text-center my-3">
            <img src="img/wasd.jpg" alt="Teclas W A S D e setas">
        </div>
        <div id="quadrados">
            <div class="quadrado" id="vermelho"></div>
            <div class="quadrado" id="azul"></div>
            <div class="quadrado" id="verde"></div>
        </div>
    </div>
</body>
</html>
