<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Praticando 3 - Manipulações (jQuery)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="praticando3.js" defer></script>
</head>
<body>
    <div class="container py-3">
        <h1>Praticando 3 - Manipulações</h1>
        <div class="d-flex flex-wrap justify-content-between gap-4">
            <div>
                <h5>Lado</h5>
                <div class="btn-group" role="group">
                    <input type="radio" class="btn-check" name="lado" id="ladoEsquerdo" checked>
                    <label class="btn btn-outline-primary" for="ladoEsquerdo">Esquerdo</label>
                    <input type="radio" class="btn-check" name="lado" id="ladoDireito">
                    <label class="btn btn-outline-primary" for="ladoDireito">Direito</label>
                </div>
            </div>
            <div>
                <h5>Parágrafos</h5>
                <button id="addParagrafo" class="btn btn-primary">Adicionar</button>
                <button id="remPrimeiro" class="btn btn-primary">Remover primeiro</button>
                <button id="remUltimo" class="btn btn-primary">Remover último</button>
                <button id="remParagrafos" class="btn btn-primary">Remover todos</button>
            </div>
            <div>
                <h5>Imagens</h5>
                <button id="addImagem" class="btn btn-primary">Adicionar</button>
                <button id="remImagem" class="btn btn-primary">Remover uma</button>
                <button id="remImagens" class="btn btn-primary">Remover todas</button>
            </div>
        </div>
        <div id="area" class="mt-3">
            <div id="paragrafos"></div>
            <div id="imagens"></div>
        </div>
    </div>
</body>
</html>
