<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praticando: cadastro com CEP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="cep.js" defer></script>
</head>

<body class="bg-light">
  <main class="container py-5" style="max-width: 720px;">
    <h1 class="h3 mb-4">Cadastro</h1>

    <form id="cadastro" class="row g-3">
      <div class="col-md-6">
        <label for="nome" class="form-label">Nome</label>
        <input id="nome" class="form-control" autofocus>
      </div>
      <div class="col-md-6">
        <label for="email" class="form-label">E-mail</label>
        <input id="email" type="email" class="form-control">
      </div>

      <div class="col-md-4">
        <label for="cep" class="form-label">CEP</label>
        <input id="cep" class="form-control" maxlength="9" placeholder="00000-000">
        <div id="msg" class="form-text"></div>
      </div>
      <div class="col-md-8">
        <label for="rua" class="form-label">Rua</label>
        <input id="rua" class="form-control" disabled>
      </div>

      <div class="col-md-3">
        <label for="numero" class="form-label">Número</label>
        <input id="numero" class="form-control">
      </div>
      <div class="col-md-4">
        <label for="bairro" class="form-label">Bairro</label>
        <input id="bairro" class="form-control" disabled>
      </div>
      <div class="col-md-3">
        <label for="cidade" class="form-label">Cidade</label>
        <input id="cidade" class="form-control" disabled>
      </div>
      <div class="col-md-2">
        <label for="uf" class="form-label">UF</label>
        <input id="uf" class="form-control" disabled>
      </div>

      <div class="col-12">
        <button type="submit" class="btn btn-success">Cadastrar</button>
      </div>
    </form>
  </main>
</body>

</html>
