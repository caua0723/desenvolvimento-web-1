<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praticando 2 - Mini calculadora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="praticando2.js" defer></script>
</head>
<body>
  <div class="container py-4">
    <h1 class="mb-4">Praticando 2 - JavaScript - Mini calculadora</h1>

    <div class="row g-3 align-items-end">
      <div class="col-auto">
        <label for="numero1" class="form-label">Número 1</label>
        <input type="number" step="any" id="numero1" class="form-control">
      </div>
      <div class="col-auto">
        <label for="numero2" class="form-label">Número 2</label>
        <input type="number" step="any" id="numero2" class="form-control">
      </div>
      <div class="col-auto">
        <label for="resultado" class="form-label">Resultado</label>
        <input type="text" id="resultado" class="form-control" readonly>
      </div>
      <div class="col-auto d-flex gap-1">
        <button class="btn btn-primary" data-operacao="soma">Soma</button>
        <button class="btn btn-primary" data-operacao="subtracao">Subtração</button>
        <button class="btn btn-primary" data-operacao="multiplicacao">Multiplicação</button>
        <button class="btn btn-primary" data-operacao="divisao">Divisão</button>
      </div>
    </div>
  </div>
</body>
</html>
