<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praticando 3 - Cores (click e mouse)</title>
  <style>
    body { font-family: Calibri, Arial, sans-serif; margin: 20px; background-color: white; }
    #caixas { display: flex; gap: 10px; margin-bottom: 10px; }
    .caixa { width: 120px; height: 30px; border: 2px solid black; cursor: pointer; }
    #preview {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      font-style: italic;
      pointer-events: none;
    }
  </style>
  <script src="praticando3.js" defer></script>
</head>
<body>
  <h1>Praticando 3 - JavaScript - Cores (click e mouse)</h1>

  <div id="caixas">
    <div class="caixa" data-cor="red"     style="background-color: red;"></div>
    <div class="caixa" data-cor="green"   style="background-color: green;"></div>
    <div class="caixa" data-cor="blue"    style="background-color: blue;"></div>
    <div class="caixa" data-cor="yellow"  style="background-color: yellow;"></div>
    <div class="caixa" data-cor="magenta" style="background-color: magenta;"></div>
  </div>

  <button id="reset">Reset</button>
  <div id="preview">Preview</div>
</body>
</html>
